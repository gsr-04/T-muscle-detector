name: ci

on:
  push:
  pull_request:

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile public source
        run: python -m compileall -q final tools src tmuscle tmuscle.py
      - name: Public release scan
        run: python scripts/check_public_release.py
      - name: Pipeline dependency scan
        run: python scripts/check_reachable.py
      - name: CLI help
        run: python tmuscle.py --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v
